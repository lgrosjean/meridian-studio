# {{name}}: Meridian on {{dataset}}. model_spec takes meridian.model.spec.ModelSpec's arguments.
name: {{name}}
dataset: {{dataset}}
model_spec:
  media_effects_dist: log_normal
  max_lag: 8
  adstock_decay_spec: geometric
  enable_aks: true
# priors:                     # PriorDistribution fields, each one TensorFlow Probability distribution (`dist`);
#                               its arguments once for all, or per channel with a default. Unset fields keep Meridian's.
#   roi_m:                      # ROI per channel; LogNormal also takes mean/sd in ROI units
#     dist: LogNormal
#     default: { mean: 1.0, sd: 1.0 }
{{roi}}
#   alpha_m:                    # adstock decay, on [0, 1]
#     dist: Beta
#     default: { concentration1: 1, concentration0: 1 }
#   ec_m: { dist: TruncatedNormal, loc: 0.8, scale: 0.8, low: 0.1, high: 10 }   # Hill half-saturation
sampling:
  n_chains: [2, 2]
  n_adapt: 1000
  n_burnin: 0
  n_keep: 1000
  seed: 1
